{{- if .Values.enabled }}
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "openab-kubernetes-session.fullname" . }}
  namespace: {{ .Values.workerNamespace }}
  labels:
    {{- include "openab-kubernetes-session.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "openab-kubernetes-session.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "openab-kubernetes-session.fullname" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
