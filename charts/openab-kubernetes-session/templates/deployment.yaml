{{- if .Values.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "openab-kubernetes-session.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "openab-kubernetes-session.labels" . | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "openab-kubernetes-session.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "openab-kubernetes-session.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "openab-kubernetes-session.fullname" . }}
      automountServiceAccountToken: true
      enableServiceLinks: false
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      nodeSelector:
        kubernetes.io/os: linux
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: controller
          image: {{ include "openab-kubernetes-session.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - /usr/bin/tini
            - --
          args:
            - /usr/local/bin/openab-kubernetes-session-controller
            - --config-file
            - /etc/openab-kubernetes-session/process/controller.toml
          securityContext:
            allowPrivilegeEscalation: false
            privileged: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
          ports:
            - name: relay
              containerPort: 8443
              protocol: TCP
            - name: probes
              containerPort: 8080
              protocol: TCP
          startupProbe:
            httpGet:
              path: /livez
              port: probes
              scheme: HTTP
            failureThreshold: 60
            periodSeconds: 5
            timeoutSeconds: 2
          livenessProbe:
            httpGet:
              path: /livez
              port: probes
              scheme: HTTP
            failureThreshold: 3
            periodSeconds: 10
            timeoutSeconds: 2
          readinessProbe:
            httpGet:
              path: /readyz
              port: probes
              scheme: HTTP
            failureThreshold: 3
            periodSeconds: 5
            timeoutSeconds: 2
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: controller-config
              mountPath: /etc/openab-kubernetes-session/process
              readOnly: true
            - name: worker-profiles
              mountPath: /etc/openab-kubernetes-session/profiles
              readOnly: true
            - name: controller-tls
              mountPath: /var/run/openab-kubernetes-session/tls
              readOnly: true
            - name: controller-auth
              mountPath: /var/run/openab-kubernetes-session/auth
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: controller-config
          configMap:
            name: {{ .Values.controllerConfig.existingConfigMap }}
            optional: false
            defaultMode: 0440
            items:
              - key: {{ .Values.controllerConfig.key }}
                path: controller.toml
        - name: worker-profiles
          configMap:
            name: {{ .Values.profiles.existingConfigMap }}
            optional: false
            defaultMode: 0440
            items:
              - key: {{ .Values.profiles.key }}
                path: profiles.toml
        - name: controller-tls
          secret:
            secretName: {{ .Values.tls.existingSecret }}
            optional: false
            defaultMode: 0440
            items:
              - key: {{ .Values.tls.certificateKey }}
                path: tls.crt
              - key: {{ .Values.tls.privateKeyKey }}
                path: tls.key
        - name: controller-auth
          secret:
            secretName: {{ .Values.authentication.existingSecret }}
            optional: false
            defaultMode: 0440
            items:
              - key: {{ .Values.authentication.credentialKey }}
                path: token
        - name: tmp
          emptyDir: {}
{{- end }}
