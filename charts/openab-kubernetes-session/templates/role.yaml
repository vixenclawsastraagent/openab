{{- if .Values.enabled }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "openab-kubernetes-session.fullname" . }}
  namespace: {{ .Values.workerNamespace }}
  labels:
    {{- include "openab-kubernetes-session.labels" . | nindent 4 }}
rules:
  - apiGroups:
      - ""
    resources:
      - configmaps
    verbs:
      - get
      - list
      - create
      - update
      - delete
  # Required when worker resources set blockOwnerDeletion on their anchor.
  - apiGroups:
      - ""
    resources:
      - configmaps/finalizers
    verbs:
      - update
  - apiGroups:
      - ""
    resources:
      - pods
      - persistentvolumeclaims
      - secrets
      - serviceaccounts
    verbs:
      - get
      - list
      - create
      - delete
  - apiGroups:
      - networking.k8s.io
    resources:
      - networkpolicies
    verbs:
      - get
      - list
      - create
      - delete
{{- end }}
