{{- if .Values.enabled }}
{{- if not .Values.networkPolicy.controller.apiServerCIDRs }}
{{- fail "networkPolicy.controller.apiServerCIDRs requires at least one exact /32 or /128 host when enabled" }}
{{- end }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "openab-kubernetes-session.controllerNetworkPolicyName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "openab-kubernetes-session.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "openab-kubernetes-session.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.workerNamespace }}
          podSelector:
            matchLabels:
              app.kubernetes.io/managed-by: openab-session-controller
              openab.dev/resource: worker-pod
        {{- range .Values.networkPolicy.controller.brokerPeers }}
        - namespaceSelector:
            matchLabels:
              {{- toYaml .namespaceLabels | nindent 14 }}
          podSelector:
            matchLabels:
              {{- toYaml .podLabels | nindent 14 }}
        {{- end }}
      ports:
        - port: 8443
          protocol: TCP
  egress:
    - to:
        {{- range .Values.networkPolicy.controller.apiServerCIDRs }}
        - ipBlock:
            cidr: {{ . }}
        {{- end }}
      ports:
        - port: {{ .Values.networkPolicy.controller.apiServerPort }}
          protocol: TCP
{{- end }}
