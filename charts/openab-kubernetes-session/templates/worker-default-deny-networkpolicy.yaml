{{- if .Values.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "openab-kubernetes-session.workerDefaultDenyNetworkPolicyName" . }}
  namespace: {{ .Values.workerNamespace }}
  labels:
    {{- include "openab-kubernetes-session.labels" . | nindent 4 }}
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
{{- end }}
