# The add-on is inert unless it is explicitly enabled.
enabled: false

# Override the short chart name used in generated resource names.
nameOverride: ""

# Override the complete release name used in generated resource names.
fullnameOverride: ""

# Existing namespace in which the controller creates isolated session workers.
# This chart deliberately does not create or own the namespace.
workerNamespace: openab-sessions

# Long-lived L3/L4 baselines. Per-session business-service egress remains in
# immutable worker profiles and is rendered dynamically by the controller.
networkPolicy:
  controller:
    # Required when the add-on is enabled. There is no portable default because
    # Service translation relative to ipBlock processing is CNI-specific.
    apiServerCIDRs: []
    # Use the Service port (normally 443) for pre-DNAT enforcement or the
    # control-plane endpoint port for a CNI that enforces after DNAT.
    apiServerPort: 443
    # Exact broker namespace and Pod label pairs admitted to relay port 8443.
    # An empty list fails closed: workers can connect, but no broker can.
    brokerPeers: []
  worker:
    dns:
      selectors:
        - namespaceLabels:
            kubernetes.io/metadata.name: kube-system
          podLabels:
            k8s-app: kube-dns
      # Optional exact /32 or /128 destinations for NodeLocal DNS or a
      # cluster-specific DNS implementation.
      cidrs: []

image:
  repository: ghcr.io/openabdev/openab-kubernetes-session-controller
  # Production installs must set an immutable digest. Mutable tags (including
  # the chart appVersion fallback) are available only through the explicit
  # development escape hatch below.
  tag: ""
  digest: ""
  allowMutableTag: false
  pullPolicy: IfNotPresent

# Existing registry credentials referenced by the controller Deployment only.
imagePullSecrets: []

# All configuration and credentials are provisioned out of band. The chart
# mounts these existing objects but never creates or owns them.
controllerConfig:
  existingConfigMap: openab-kubernetes-session-controller-config
  key: controller.toml

profiles:
  existingConfigMap: openab-kubernetes-session-worker-profiles
  key: profiles.toml

tls:
  existingSecret: openab-kubernetes-session-controller-tls
  certificateKey: tls.crt
  privateKeyKey: tls.key

authentication:
  existingSecret: openab-kubernetes-session-controller-auth
  credentialKey: token

# Conservative defaults for the controller and in-memory relay. Worker
# resources belong to immutable worker profiles, not to this chart.
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi
