name: Kubernetes Session Images

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - '.github/workflows/kubernetes-session-images.yml'
      - 'Dockerfile.kubernetes-session'
      - 'scripts/test-kubernetes-session-images.sh'
      - 'scripts/test-kubernetes-session-kind.sh'
      - 'scripts/test-kubernetes-session-kind-contract.sh'
      - 'tests/fixtures/kubernetes-session-kind/**'
      - 'charts/openab-kubernetes-session/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'src/**'
      - 'crates/openab-core/Cargo.toml'
      - 'crates/openab-core/src/**'
      - 'crates/openab-gateway/Cargo.toml'
      - 'crates/openab-gateway/src/**'
      - 'crates/openab-mcp/Cargo.toml'
      - 'crates/openab-mcp/src/**'
      - 'crates/openab-kubernetes-session/Cargo.toml'
      - 'crates/openab-kubernetes-session/Cargo.lock'
      - 'crates/openab-kubernetes-session/src/**'

permissions:
  contents: read

concurrency:
  group: kubernetes-session-images-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  smoke-test:
    # This is the Linux/Docker verification gate for the add-on and therefore
    # also runs while an architecture PR remains in draft.
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6

      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1
        with:
          version: v3.18.5

      - uses: azure/setup-kubectl@776406bce94f63e41d621b960d78ee25c8b76ede # v4.0.1
        with:
          version: v1.32.11

      - name: Install pinned Kind
        env:
          KIND_SHA256: eb244cbafcc157dff60cf68693c14c9a75c4e6e6fedaf9cd71c58117cb93e3fa
          KIND_VERSION: v0.31.0
        run: |
          curl --fail --location --silent --show-error \
            --output "$RUNNER_TEMP/kind" \
            "https://github.com/kubernetes-sigs/kind/releases/download/$KIND_VERSION/kind-linux-amd64"
          echo "$KIND_SHA256  $RUNNER_TEMP/kind" | sha256sum --check --strict
          sudo install -m 0755 "$RUNNER_TEMP/kind" /usr/local/bin/kind

      - name: Verify Kind harness contracts
        run: sh scripts/test-kubernetes-session-kind-contract.sh

      - name: Build and verify isolated-session images
        run: sh scripts/test-kubernetes-session-images.sh --build

      - name: Verify controller and worker registration in Kind
        run: sh scripts/test-kubernetes-session-kind.sh --smoke
