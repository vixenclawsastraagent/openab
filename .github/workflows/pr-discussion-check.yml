name: PR Discussion URL Check

on:
  pull_request_target:
    types: [opened, edited, synchronize]

concurrency:
  group: pr-discussion-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      # pull_request_target must only execute trusted default-branch policy.
      - name: Check out the default branch policy
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Test PR discussion workflow contract
        run: perl .github/scripts/test_pr_discussion_check_workflow.pl
      - name: Create GitHub App token
        id: app-token
        if: github.repository == 'openabdev/openab'
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
      - name: Check Discord discussion URL
        uses: actions/github-script@v7
        with:
          github-token: ${{ steps.app-token.outputs.token || github.token }}
          script: |
            const pr = context.payload.pull_request;
            const body = pr.body || '';
            const labels = pr.labels.map(l => l.name);
            const marker = '<!-- openab-pr-discussion-check -->';
            const label = 'closing-soon';
            const isUpstream =
              context.repo.owner === 'openabdev' &&
              context.repo.repo === 'openab';

            const hasDiscordUrl = /https:\/\/(discord\.com|discordapp\.com)\/channels\/\d+\/\d+/.test(body);

            const comments = await github.rest.issues.listComments({
              ...context.repo,
              issue_number: pr.number
            });
            const old = comments.data.find(c => c.body.includes(marker));

            // Exempt bot-authored PRs (e.g. openab-app release PRs)
            if (pr.user.type === 'Bot') {
              console.log(`Skipping discussion check for bot PR by ${pr.user.login}`);
              if (old) {
                await github.rest.issues.deleteComment({ ...context.repo, comment_id: old.id });
              }
              if (labels.includes(label)) {
                try { await github.rest.issues.removeLabel({ ...context.repo, issue_number: pr.number, name: label }); } catch (e) { if (e.status !== 404) throw e; }
              }
              return;
            }

            // The organization App can read this team; fork-scoped tokens cannot.
            if (isUpstream) {
              const { data: maintainerMembers } = await github.rest.teams.listMembersInOrg({
                org: 'openabdev',
                team_slug: 'openab-maintainers',
                per_page: 100
              });
              const maintainerLogins = new Set(maintainerMembers.map(m => m.login));
              if (maintainerLogins.has(pr.user.login)) {
                console.log(`Skipping discussion check for maintainer ${pr.user.login}`);
                if (old) {
                  await github.rest.issues.deleteComment({ ...context.repo, comment_id: old.id });
                }
                if (labels.includes(label)) {
                  try { await github.rest.issues.removeLabel({ ...context.repo, issue_number: pr.number, name: label }); } catch (e) { if (e.status !== 404) throw e; }
                }
                return;
              }
            }

            if (!hasDiscordUrl) {
              if (!labels.includes(label)) {
                await github.rest.issues.addLabels({
                  ...context.repo,
                  issue_number: pr.number,
                  labels: [label]
                });
              }

              const msg = [
                marker,
                '> [!CAUTION]',
                '> This PR is missing a **Discord Discussion URL** in the body.',
                '> This PR will be **automatically closed in 24 hours** if the link is not added.',
                '',
                'All PRs must reference a prior Discord discussion to ensure community alignment before implementation.',
                '',
                'Please edit the PR description to include a link like:',
                '```',
                'Discord Discussion URL: https://discord.com/channels/...',
                '```'
              ].join('\n');

              if (!old) {
                await github.rest.issues.createComment({
                  ...context.repo,
                  issue_number: pr.number,
                  body: msg
                });
              }

              core.setFailed('PR body is missing a Discord Discussion URL');
            } else {
              // URL found — remove label and comment if present
              if (labels.includes(label)) {
                try {
                  await github.rest.issues.removeLabel({
                    ...context.repo,
                    issue_number: pr.number,
                    name: label
                  });
                } catch (e) {
                  if (e.status !== 404) throw e;
                }
              }
              if (old) {
                await github.rest.issues.deleteComment({
                  ...context.repo,
                  comment_id: old.id
                });
              }
            }
