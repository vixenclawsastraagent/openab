[package]
name = "openab-kubernetes-session"
version = "0.1.0"
edition = "2021"
license = "MIT"

# This add-on owns its dependency graph and release artifacts independently of
# the default OpenAB workspace.
[workspace]

[features]
default = []
client-transport = [
    "dep:rustls",
    "dep:rustls-native-certs",
    "dep:rustls-pemfile",
    "dep:tokio-tungstenite",
    "dep:zeroize",
    "tokio-tungstenite/connect",
    "tokio-tungstenite/rustls-tls-native-roots",
]
bridge-runtime = [
    "client-transport",
    "dep:futures-util",
    "dep:tokio",
    "tokio/io-std",
    "tokio/net",
]
worker-runtime = [
    "client-transport",
    "dep:rustix",
    "dep:tokio",
    "tokio/signal",
]
controller = [
    "dep:futures-util",
    "dep:getrandom",
    "dep:http",
    "dep:k8s-openapi",
    "dep:kube",
    "dep:rustls",
    "dep:rustls-pemfile",
    "dep:subtle",
    "dep:tokio",
    "dep:tokio-tungstenite",
    "dep:toml",
]
controller-runtime = [
    "controller",
    "dep:axum",
    "dep:hyper",
    "dep:hyper-util",
    "dep:rustls-pemfile",
    "dep:tokio-rustls",
    "dep:tracing",
    "dep:tracing-subscriber",
    "dep:zeroize",
    "tokio/net",
    "tokio/signal",
    "tokio-tungstenite/handshake",
]

[dependencies]
async-trait = "0.1"
axum = { version = "0.8", default-features = false, optional = true }
chrono = { version = "0.4", features = ["serde"] }
futures-util = {
    version = "0.3",
    default-features = false,
    features = ["sink", "std"],
    optional = true,
}
getrandom = { version = "0.4", optional = true }
hex = "0.4"
http = { version = "1", optional = true }
hyper = { version = "1", default-features = false, features = ["http1", "server"], optional = true }
hyper-util = { version = "0.1", default-features = false, features = ["service", "tokio"], optional = true }
k8s-openapi = { version = "=0.28.0", features = ["v1_32"], optional = true }
kube = { version = "=4.2.0", default-features = false, features = ["client", "ring", "rustls-tls"], optional = true }
rustls = { version = "=0.22.4", default-features = false, features = ["ring", "tls12"], optional = true }
rustls-native-certs = { version = "=0.7.3", optional = true }
rustls-pemfile = { version = "=2.2.0", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
subtle = { version = "2", optional = true }
thiserror = "2"
tokio = { version = "1", features = ["io-util", "macros", "rt", "sync", "time"], optional = true }
tokio-tungstenite = { version = "0.21", default-features = false, optional = true }
tokio-rustls = { version = "=0.26.4", default-features = false, features = ["ring", "tls12"], optional = true }
toml = { version = "0.8", optional = true }
tracing = { version = "0.1", optional = true }
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt"], optional = true }
uuid = { version = "1", features = ["serde", "v4"] }
zeroize = { version = "1", optional = true }

[target.'cfg(unix)'.dependencies]
rustix = { version = "=1.1.4", default-features = false, features = ["fs", "process", "std"], optional = true }

[dev-dependencies]
rcgen = "=0.14.8"
tokio = { version = "1", features = ["io-util", "macros", "rt", "test-util", "time"] }
tower = { version = "0.5", features = ["util"] }
tower-test = "0.4"

[[bin]]
name = "openab-kubernetes-session"
path = "src/bin/openab-kubernetes-session.rs"
required-features = ["bridge-runtime"]

[[bin]]
name = "openab-kubernetes-session-controller"
path = "src/bin/openab-kubernetes-session-controller.rs"
required-features = ["controller-runtime"]

[[bin]]
name = "openab-kubernetes-session-worker"
path = "src/bin/openab-kubernetes-session-worker.rs"
required-features = ["worker-runtime"]
