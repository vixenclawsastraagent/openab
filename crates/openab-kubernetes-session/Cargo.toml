[package]
name = "openab-kubernetes-session"
version = "0.1.0"
edition = "2021"
license = "MIT"

# This add-on owns its dependency graph and release artifacts independently of
# the default OpenAB workspace.
[workspace]

[features]
default = []
controller = ["dep:k8s-openapi", "dep:kube", "dep:tokio"]

[dependencies]
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
hex = "0.4"
k8s-openapi = { version = "=0.28.0", features = ["v1_32"], optional = true }
kube = { version = "=4.2.0", default-features = false, features = ["client", "ring", "rustls-tls"], optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["sync"], optional = true }
uuid = { version = "1", features = ["serde", "v4"] }

[dev-dependencies]
http = "1"
tokio = { version = "1", features = ["macros", "rt", "time"] }
tower-test = "0.4"
